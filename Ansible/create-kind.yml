---
- name: Spin up Kind Clusters
  hosts: cluster_nodes
  become: no  # Kind uses Docker, and we already added ubuntu to the docker group!
  tasks:
    - name: Create Kind configuration file
      copy:
        dest: /home/ubuntu/kind-config.yaml
        content: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            apiServerAddress: "0.0.0.0"
            apiServerPort: 6443
          kubeadmConfigPatches:
          - |
            kind: ClusterConfiguration
            apiServer:
              certSANs:
              - "{{ ansible_host }}"
          nodes:
          - role: control-plane
          - role: worker

    - name: Create the clusters dynamically
      shell: kind create cluster --name {{ inventory_hostname }} --config /home/ubuntu/kind-config.yaml
